instructions: |
  **MA Bull Trend**
  - MA5 > MA10 > MA20 bullish stacking.
  - Volume confirms the trend (volume_ratio > 1.2).
  - Re-buy on MA5/MA10 pullback within the stack.
  - Stop below MA20. Never chase a gap above two ATRs.