name: docs audit

# A weekly sweep of the two things a reviewer only notices by eye: a citation
# that points past the end of the file it names, and an external link that has
# gone dead.  The register/citation validator reports legacy debt as warnings
# (so it never blocks a change); this scheduled run is the one place they are
# turned into an issue, because nobody is reading a full-run log otherwise.

on:
  schedule:
    - cron: "0 9 * * 5" # Fridays, 09:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    name: register, citation and link audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Register + citation audit
        id: registers
        run: |
          set +e
          python scripts/validate_registers.py --limit 500 --fail-on-warnings \
            > register-report.txt 2>&1
          echo "found=$?" >> "$GITHUB_OUTPUT"

      - name: Link audit
        id: links
        run: |
          set +e
          python scripts/url_probe.py --verbose > link-report.txt 2>&1
          echo "found=$?" >> "$GITHUB_OUTPUT"

      - name: Open an issue when either sweep found something
        if: steps.registers.outputs.found != '0' || steps.links.outputs.found != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const read = (p) => { try { return fs.readFileSync(p, 'utf8'); } catch { return '(no output)'; } };
            const date = new Date().toISOString().slice(0, 10);
            const body = [
              `Weekly docs audit, ${date}.`,
              '',
              '### Registers and citations (`scripts/validate_registers.py`)',
              '```',
              read('register-report.txt').slice(0, 60000),
              '```',
              '',
              '### External links (`scripts/url_probe.py`)',
              '```',
              read('link-report.txt').slice(0, 60000),
              '```',
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `docs audit: findings ${date}`,
              body,
            });
